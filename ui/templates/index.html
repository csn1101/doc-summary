<!DOCTYPE html>
<html>
<head>
    <title>Document Upload</title>
</head>
<body>

<h2>Upload File</h2>

<form method="POST" enctype="multipart/form-data">
    <input type="file" name="file" required>
    <br><br>
    <button type="submit">Upload</button>
</form>

{% if result %}
    <h3>Summary Output:</h3>
    <pre>{{ result }}</pre>
{% endif %}

</body>
</html>
